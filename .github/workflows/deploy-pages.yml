name: Publish KAJIMIRU demo

on:
  push:
    branches: [main, codex/kajimiru-design-preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Create static demo
        run: |
          pnpm exec vinext dev --port 3000 > /tmp/kajimiru.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://localhost:3000 > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://localhost:3000 > /dev/null || { cat /tmp/kajimiru.log; exit 1; }
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            export KAJIMIRU_RELEASE_LABEL="OFFLINE UI DEMO"
          else
            export KAJIMIRU_RELEASE_LABEL="DESIGN PREVIEW"
          fi
          KAJIMIRU_PREVIEW_URL=http://localhost:3000 pnpm export:offline
          touch exports/KAJIMIRU-offline-preview/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: exports/KAJIMIRU-offline-preview

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
